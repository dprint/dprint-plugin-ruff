[package]
name = "dprint-plugin-ruff"
version = "0.12.3"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
keywords = ["formatting", "formatter", "ruff"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-ruff"
description = "Python formatter for dprint via Ruff."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
anyhow = "1.0.51"
dprint-core = { version = "0.75.2", default-features = false }
ruff_formatter = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_linter = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
ruff_python_semantic = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6", features = ["serde"] }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.6" }
serde = { version = "1.0.108", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"

[dev-dependencies]
dprint-development = "0.12.1"
pretty_assertions = "1.4.0"
serde_json = { version = "1.0" }

[patch.crates-io]
getrandom = { git = "https://github.com/rust-random/getrandom", rev = "5ecab629385174c842b19716e90b0c8896790ddc" }
# fix the wasm build when zip enables wasm_js and the plugin overrides the backend
getrandom_04 = { package = "getrandom", git = "https://github.com/rust-random/getrandom", rev = "967752d9889ce890c7ac2c8d304d1748d7911d11" }
web-time = { path = "./web-time" }
